<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mensajes Oficiales</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1224">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<!-- FIREBASE SDK (Compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root {
    --navy: #0b1224; --navy2: #141f3d; --gold: #e8b13c; --gold2: #f3d08a;
    --teal: #3fc7c7; --white: #f1f1f1; --border: #2a3a5c; --danger: #e57373; --wsp: #25D366;
  }
  * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
  body { margin: 0; background: radial-gradient(circle at top, #10193a, #060a17 100%); color: var(--white); min-height: 100vh; }
  .container { max-width: 500px; margin: 0 auto; padding: 20px 16px 60px; position: relative; }
  
  h1 { text-align: center; font-size: 24px; background: linear-gradient(90deg, var(--gold2), var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 10px 0 24px; text-transform: uppercase; }
  h2 { color: var(--gold2); font-size: 16px; margin-top: 24px; border-bottom: 1px solid var(--border); padding-bottom: 6px; text-transform: uppercase;}
  
  label { display: block; margin: 16px 0 6px; color: var(--teal); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  input, select, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--navy); color: var(--white); font-size: 15px; outline: none; transition: border 0.3s; }
  input:focus, textarea:focus, select:focus { border-color: var(--teal); }
  textarea { min-height: 180px; resize: vertical; font-weight: bold; }
  .checkbox-label { display: flex; align-items: center; gap: 10px; cursor: pointer; text-transform: none; color: var(--white); font-weight: normal; font-size: 14px;}
  .checkbox-label input { width: auto; transform: scale(1.2); }
  
  input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
  
  button { cursor: pointer; border: 1px solid var(--gold); background: transparent; color: var(--gold2); padding: 12px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; transition: all 0.2s; width: 100%; margin-top: 10px; }
  button:active { transform: scale(0.98); }
  .btn-primary { background: linear-gradient(90deg, var(--gold), var(--gold2)); color: var(--navy); border: none; box-shadow: 0 4px 15px rgba(232, 177, 60, 0.2); }
  .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }
  .btn-outline { background: transparent; border: 1px solid var(--gold); color: var(--gold2); font-weight: normal; }
  .btn-outline:hover { background: rgba(232, 177, 60, 0.1); }
  
  .btn-whatsapp { background: var(--wsp); color: white; border: none; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.2); font-weight: bold; }
  .btn-whatsapp:hover { background: #1ebd5a; color: white; }

  .btn-row { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .btn-row button { flex: 1; min-width: 80px; margin-top: 0; padding: 14px 8px; font-size: 13px; display: flex; align-items: center; justify-content: center; text-align: center; }
  .btn-text { background: none; border: none; color: var(--teal); text-decoration: underline; padding: 8px; font-weight: normal; }
  .btn-danger { border-color: var(--danger); color: var(--danger); }
  
  .card { border: 1px solid var(--border); background: rgba(20, 31, 61, 0.7); border-radius: 12px; padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); backdrop-filter: blur(4px); margin-bottom: 16px; }
  .interv-block { border-left: 3px solid var(--teal); background: rgba(11, 18, 36, 0.8); border-radius: 0 8px 8px 0; padding: 16px; margin-top: 12px; position: relative; }
  .remove-btn { position: absolute; top: 12px; right: 12px; width: auto; padding: 4px 10px; font-size: 11px; border-color: var(--danger); color: var(--danger); margin: 0; }
  .tag { display: inline-block; font-size: 11px; color: var(--teal); border: 1px solid var(--teal); border-radius: 20px; padding: 3px 10px; margin-bottom: 8px; font-weight: 600;}
  
  .module-select { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
  .module-select button { padding: 20px 10px; font-size: 14px; line-height: 1.4; height: 100%; border-radius: 12px; }

  pre.output { white-space: pre-wrap; background: #050812; border: 1px solid var(--border); border-radius: 8px; padding: 16px; font-family: 'Courier New', monospace; font-size: 14px; color: #e8e8e8; line-height: 1.5; max-height: 60vh; overflow-y: auto; font-weight: bold; }
  #reviewText { font-family: 'Courier New', monospace; min-height: 450px; font-size: 14px; line-height: 1.5; font-weight: bold; }
  
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .top-bar span { font-size: 14px; color: #8fa0c4; }
  .top-bar button { width: auto; margin: 0; padding: 6px 12px; border: none; font-size: 13px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--teal); color: var(--navy); padding: 10px 20px; border-radius: 20px; font-weight: bold; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 1000; }
  .toast.show { opacity: 1; }
  .loading { text-align: center; padding: 60px 0; color: #8fa0c4; font-size: 16px; }
  .logo-container { text-align: center; margin-bottom: 10px; }
  .logo-container img { width: 100px; opacity: 0.95; }
  .logo-subtitle { display: block; letter-spacing: 3px; color: var(--gold2); font-size: 11px; margin-top: 8px; text-transform: uppercase;}
  
  .conditional-field { display: none; background: rgba(63, 199, 199, 0.1); padding: 12px; border-radius: 6px; margin-top: 10px; border-left: 3px solid var(--teal); }
  .conditional-field.show { display: block; }
  .section-toggle-wrap { background: rgba(20, 31, 61, 0.5); padding: 12px; border-radius: 8px; border: 1px solid var(--border); margin-top: 16px; }
</style>
</head>
<body>
<div class="container" id="app"><div class="loading">Cargando plataforma...</div></div>
<div id="toast" class="toast">Texto copiado al portapapeles</div>

<script>
/* --- 1. CONFIGURACIÓN FIREBASE --- */
const firebaseConfig = {
  apiKey: "AIzaSyB7EJn3DjG4tsdU2-8m15uhRaD2PSlnUrg",
  authDomain: "mensajes-carabineros-app.firebaseapp.com",
  projectId: "mensajes-carabineros-app",
  storageBucket: "mensajes-carabineros-app.firebasestorage.app",
  messagingSenderId: "97537422358",
  appId: "1:97537422358:web:a2b6eb9623d9c6d0b97137"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

/* --- 2. ESTADO GLOBAL --- */
let state = { view: 'login', editId: null, module: null, currentUser: null, draft: null };
let cachedMsgs = [];
const app = document.getElementById('app');

/* --- 3. AUTENTICACIÓN --- */
auth.onAuthStateChanged(async (user) => {
  if (user) {
    state.currentUser = user;
    state.view = 'dashboard';
    await loadMessages();
  } else {
    state.currentUser = null;
    state.view = 'login';
  }
  render();
});

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  try { await auth.signInWithEmailAndPassword(email, pass); } 
  catch(e) { alert("Error de acceso: Verifica tus credenciales."); }
}

async function doRegister() {
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const pass = document.getElementById('loginPass').value;

  if (!email.endsWith('@carabineros.cl')) {
    alert("ACCESO DENEGADO: Por medidas de seguridad, solo se permite el registro con correos institucionales (@carabineros.cl).");
    return;
  }
  if (pass.length < 6) {
    alert("La clave debe tener al menos 6 caracteres.");
    return;
  }

  try {
    await auth.createUserWithEmailAndPassword(email, pass);
    alert("Cuenta creada con éxito. Bienvenido al sistema.");
  } catch(e) {
    if (e.code === 'auth/email-already-in-use') {
      alert("Este correo institucional ya está registrado. Intenta ingresar con tu clave.");
    } else {
      alert("Error al registrar: " + e.message);
    }
  }
}
  
function logout() { auth.signOut(); }

/* --- 4. BASE DE DATOS (FIRESTORE) --- */
async function loadMessages() {
  try {
    const snap = await db.collection('messages').where('uid', '==', state.currentUser.uid).get();
    cachedMsgs = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => b.updatedAt - a.updatedAt);
  } catch (error) {
    console.error("Error al cargar mensajes:", error);
  }
}

async function saveMessage(msg, editId) {
  const payload = { ...msg, uid: state.currentUser.uid, updatedAt: Date.now() };
  if (editId) {
    await db.collection('messages').doc(editId).update(payload);
    return editId;
  } else {
    payload.createdAt = Date.now();
    const ref = await db.collection('messages').add(payload);
    return ref.id;
  }
}

async function deleteMsg(id) {
  if (!confirm('¿Estás seguro de eliminar definitivamente este procedimiento?')) return;
  await db.collection('messages').doc(id).delete();
  await loadMessages();
  state.view = 'dashboard';
  render();
}

/* --- 5. LÓGICAS DE GENERACIÓN DE TEXTO --- */
function toInitials(name) {
  if (!name) return '';
  return name.trim().split(/\s+/).map(w => w[0].toUpperCase() + '.').join('');
}

function generateModulo1(d) {
  let formatTitle = (d.titulo || 'PROCEDIMIENTO').toUpperCase();
  let formatPref = (d.prefectura || 'PREFECTURA').toUpperCase().replace(/SANTIAGO/g, 'STGO.');
  if (!formatPref.includes('PREFECTURA') && !formatPref.includes('PREF') && formatPref !== 'PREFECTURA') {
      formatPref = 'PREFECTURA ' + formatPref;
  }
  let formatUni = (d.unidad || 'UNIDAD').toUpperCase().replace(/COMISAR[IÍ]A/g, 'COM.');

  const title = `*${formatTitle} - ${formatPref} - ${formatUni}*`;
  const body = `${d.hora || '--:--'} hrs.\n${d.relato || ''}`.trim();
  
  let intervLines = '';
  if (d.tieneIntervinientes && d.intervinientes && d.intervinientes.length > 0) {
    intervLines = d.intervinientes.map(i => {
      let parts = [toInitials(i.nombre)];
      if (i.edad) parts.push(`${i.edad} años`);
      
      if (i.nacionalidad) {
          let nacText = i.nacionalidad;
          if (i.migratoria && i.migratoria !== '') {
              nacText += ` (Sit. ${i.migratoria})`;
          }
          parts.push(nacText);
      }
      
      if (i.antecedentes) parts.push(`Ant: ${i.antecedentes}`);
      
      if (i.tipo === 'LESIONADO' && i.lesiones) {
        parts.push(`Lesiones: ${i.lesiones}`);
        if (i.caracterLesiones) parts.push(`Carácter: ${i.caracterLesiones}`);
      }
      
      if (i.tipo === 'CONDUCTOR' && i.temperancia) {
        parts.push(`Temperancia: ${i.temperancia}`);
      }
      
      return `*${(i.tipo || 'INTERVINIENTE').toUpperCase()}:* ${parts.join(', ')}.`;
    }).join('\n');
  }

  let mpText = '';
  if (!d.tomaConocimientoMp) {
    mpText = '*MINISTERIO PÚBLICO:* No toma conocimiento.';
  } else if (d.mpPendiente) {
    mpText = '*MINISTERIO PÚBLICO:* En espera de instrucciones.';
  } else {
    let controlDetails = '';
    if (d.tieneDetenido && d.pasaControl) {
      controlDetails = ` Pasa a ${d.tipoControl || 'control de detención'}.`;
    } else if (d.tieneDetenido && d.pasaControl === false) {
      controlDetails = ` No pasa a control de detención.`;
    }
    mpText = `*MINISTERIO PÚBLICO:* Fiscal ${d.fiscal || '—'}, Folio ${d.folio || '—'}.${controlDetails} ${d.instrucciones || ''}`.trim();
  }
  
  const tags = [];
  if (d.enDesarrollo) tags.push('*Procedimiento en Desarrollo*');
  tags.push(d.informaOS1 ? '*Se informa OS1*' : '*No se informa OS1*');

  return [title, body, intervLines, mpText, tags.join('\n')].filter(Boolean).join('\n\n');
}

function generateModulo2(d) {
  const body = (d.relato || '').trim();
  const mp = d.mp ? `*MINISTERIO PÚBLICO:* ${d.mp}` : '';
  return ['*AMPLIACIÓN*', body, mp, '*Se amplía mensaje a OS1.*'].filter(Boolean).join('\n\n');
}

function buildOS1Base(d) {
  const titulo = (d.titulo || 'PROCEDIMIENTO POLICIAL').toUpperCase();
  const comuna = (d.comuna || 'COMUNA NO ESPECIFICADA').toUpperCase();
  const hora = d.hora || '--:--';
  const relato = (d.relato || '').toUpperCase();

  let intervText = '';
  if (d.tieneIntervinientes && d.intervinientes && d.intervinientes.length > 0) {
    intervText = d.intervinientes.map(i => {
      const parts = [`- ${(i.tipo || 'INTERVINIENTE').toUpperCase()}: ${i.nombre.toUpperCase()}`];
      if (i.rut) parts.push(`CÉDULA DE IDENTIDAD / PASAPORTE: ${i.rut.toUpperCase()}`);
      if (i.edad) parts.push(`EDAD: ${i.edad} AÑOS`);
      
      if (i.nacionalidad) {
          let nacText = `NACIONALIDAD: ${i.nacionalidad.toUpperCase()}`;
          if (i.migratoria && i.migratoria !== '') {
              nacText += ` (SITUACIÓN ${i.migratoria.toUpperCase()})`;
          }
          parts.push(nacText);
      }
      
      if (i.antecedentes) parts.push(`ANTECEDENTES PENALES: ${i.antecedentes.toUpperCase()}`);
      if (i.vehiculo) parts.push(`VEHÍCULO: ${i.vehiculo.toUpperCase()}`);
      
      if (i.tipo === 'LESIONADO' && i.lesiones) {
        parts.push(`LESIONES: ${i.lesiones.toUpperCase()}`);
        if (i.caracterLesiones) parts.push(`CARÁCTER DE LESIONES: ${i.caracterLesiones.toUpperCase()}`);
      }
      
      if (i.tipo === 'CONDUCTOR' && i.temperancia) {
        parts.push(`ESTADO DE TEMPERANCIA ALCOHÓLICA: ${i.temperancia.toUpperCase()}`);
      }
      
      return parts.join(', ');
    }).join('\n');
  }

  let mpText = '';
  if (!d.tomaConocimientoMp) {
    mpText = 'NO TOMA CONOCIMIENTO.';
  } else if (d.mpPendiente) {
    mpText = 'EL MINISTERIO PÚBLICO SE ENCUENTRA EN ESPERA DE INSTRUCCIONES.';
  } else {
    let controlDetails = '';
    if (d.tieneDetenido && d.pasaControl) {
      controlDetails = ` PASA A ${(d.tipoControl || 'CONTROL DE DETENCIÓN').toUpperCase()}.`;
    } else if (d.tieneDetenido && d.pasaControl === false) {
      controlDetails = ` NO PASA A CONTROL DE DETENCIÓN.`;
    }
    mpText = `SE DIO CUENTA AL FISCAL ${(d.fiscal || '—').toUpperCase()}, QUEDANDO REGISTRADO BAJO EL FOLIO ${(d.folio || '—').toUpperCase()}.${controlDetails} INSTRUCCIONES: ${(d.instrucciones || '').toUpperCase()}`;
  }

  const estadoDesarrollo = d.enDesarrollo ? 'EL PROCEDIMIENTO SE MANTIENE EN DESARROLLO. ' : '';
  
  const cierre = d.enDesarrollo 
    ? 'ES TODO CUANTO SE INFORMA AMPLIANDO ANTECEDENTES POSTERIORMENTE.' 
    : 'ES TODO CUANTO SE INFORMA.';

  const partes = [
    `MEDIANTE EL PRESENTE DOCUMENTO Y DE CONFORMIDAD AL PROCEDIMIENTO POLICIAL DE ${titulo}, OCURRIDO EN LA COMUNA DE ${comuna}, APROXIMADAMENTE A LAS ${hora} HORAS. SE INFORMA QUE: ${relato}`,
    intervText ? `ANTECEDENTES DE LOS INTERVINIENTES:\n${intervText}` : '',
    `INSTRUCCIONES DEL MINISTERIO PÚBLICO:\n${mpText}`,
    `${estadoDesarrollo}${cierre}`,
    (d.remitente || '').toUpperCase(),
    (d.telefono || '').toUpperCase()
  ];

  return partes.filter(x => x !== undefined && x.trim() !== '').join('\n\n').replace(/\n{3,}/g, '\n\n').trim();
}

function moduleName(mod) { 
  return { m1: 'WhatsApp Procedimiento', m2: 'Ampliación', m3: 'Mensaje OS1' }[mod] || mod; 
}

/* --- 6. RENDERIZADO DE INTERFAZ Y ROUTER --- */
function render() {
  if (!state.currentUser) return renderLogin();
  
  if (state.view === 'moduleSelect') return renderModuleSelect();
  if (state.view === 'form') return renderForm();
  if (state.view === 'review') return renderReview();
  if (state.view === 'reviewOS1') return renderReviewOS1();
  if (state.view === 'view') return renderView();
  
  renderDashboard();
}

function getLogoHTML() {
  return `
    <div class="logo-container">
      <img src="icon-192.png" alt="Logo Carabineros">
      <span class="logo-subtitle">Mensajes Carabineros</span>
    </div>
  `;
}

function renderLogin() {
  app.innerHTML = `
    ${getLogoHTML()}
    <h1>ACCESO OFICIAL</h1>
    <div class="card">
      <label>Correo Institucional</label>
      <input id="loginEmail" type="email" placeholder="nombre.apellido@carabineros.cl">
      <label>Clave (Mínimo 6 caracteres)</label>
      <input id="loginPass" type="password" placeholder="••••••••">
      <button class="btn-primary" style="margin-top:24px;" onclick="doLogin()">Ingresar al Sistema</button>
      
      <div style="text-align:center; margin-top:16px;">
        <button class="btn-text" onclick="doRegister()">¿Nuevo usuario? Regístrate aquí</button>
      </div>
    </div>
  `;
}

function renderDashboard() {
  app.innerHTML = `
    <div class="top-bar">
      <span>👤 ${state.currentUser.email}</span>
      <button class="btn-text" onclick="logout()">Salir</button>
    </div>
    ${getLogoHTML()}
    <h1>MIS PROCEDIMIENTOS</h1>
    <button class="btn-primary" onclick="state.module=null; state.editId=null; state.view='moduleSelect'; render()">
      + NUEVO MENSAJE
    </button>
    <h2>Historial Reciente</h2>
    <div id="list"></div>
  `;
  const list = document.getElementById('list');
  if(cachedMsgs.length === 0) {
    list.innerHTML = `<div class="card" style="text-align:center; color:#8fa0c4;">Sin registros recientes</div>`;
    return;
  }
  
  cachedMsgs.forEach(m => {
    list.innerHTML += `
      <div class="card">
        <span class="tag">${moduleName(m.module)}</span>
        <h3 style="margin:4px 0 6px; color:var(--gold2); font-size:16px;">${m.titulo || '(Sin título)'}</h3>
        <div style="font-size:12px; color:#8fa0c4; margin-bottom: 12px;">${new Date(m.updatedAt).toLocaleString()}</div>
        <div class="btn-row">
          <button class="btn-outline" onclick="state.module='${m.module}'; state.view='view'; state.editId='${m.id}'; render()">👁️ Ver</button>
          <button class="btn-outline" onclick="state.module='${m.module}'; state.view='form'; state.editId='${m.id}'; render()">✏️ Editar</button>
          <button class="btn-outline btn-danger" onclick="deleteMsg('${m.id}')">🗑️ Eliminar</button>
        </div>
      </div>
    `;
  });
}

function renderModuleSelect() {
  app.innerHTML = `
    <div class="top-bar"><button class="btn-text" onclick="state.view='dashboard'; render()">← Volver</button></div>
    ${getLogoHTML()}
    <h1>ELIGE UN MÓDULO</h1>
    <div class="module-select">
      <button class="btn-outline" onclick="state.module='m1'; state.editId=null; state.view='form'; render()">1. WhatsApp de procedimiento</button>
      <button class="btn-outline" onclick="state.module='m2'; state.editId=null; state.view='form'; render()">2. Ampliación</button>
      <button class="btn-outline" onclick="state.module='m3'; state.editId=null; state.view='form'; render()">3. Mensaje / Informe a OS1</button>
      <button class="btn-outline" onclick="alert('Para corregir, edita el mensaje directamente desde el historial.')">4. Corrección (editar historial)</button>
    </div>
  `;
}

/* --- 7. FORMULARIOS DINÁMICOS --- */
function renderForm() {
  const msgGuardado = state.editId ? cachedMsgs.find(x => x.id === state.editId) : null;
  const mod = state.module || (msgGuardado ? msgGuardado.module : null);
  state.module = mod;
  
  const d = msgGuardado ? msgGuardado.data : {};
  let extraFields = '';

  if (mod === 'm1' || mod === 'm3') {
    const tieneIntervChecked = d.tieneIntervinientes ? 'checked' : '';
    const displayIntervContainer = d.tieneIntervinientes ? 'block' : 'none';
    
    const tomaMpChecked = d.tomaConocimientoMp !== false ? 'checked' : '';
    const displayMpContainer = d.tomaConocimientoMp !== false ? 'block' : 'none';

    extraFields = `
      <label>Título / Delito</label>
      <input id="f_titulo" value="${d.titulo||''}" placeholder="Ej: 01 DETENIDO POR ROBO EN LUGAR HABITADO">
      
      <div style="display:flex; gap:10px;">
        <div style="flex:1"><label>Prefectura</label><input id="f_prefectura" value="${d.prefectura||''}" placeholder="Ej: Santiago Sur"></div>
        <div style="flex:1"><label>Unidad</label><input id="f_unidad" value="${d.unidad||''}" placeholder="Ej: 13 Com. La Granja"></div>
      </div>

      <div style="display:flex; gap:10px;">
        <div style="flex:1"><label>Comuna</label><input id="f_comuna" value="${d.comuna||''}" placeholder="Ej: La Granja"></div>
        <div style="flex:1"><label>Hora</label><input id="f_hora" type="time" value="${d.hora||''}"></div>
      </div>
      
      <label>Relato de los Hechos</label>
      <textarea id="f_relato" placeholder="Descripción clara y cronológica...">${d.relato||''}</textarea>
      
      <!-- SECCIÓN INTERVINIENTES SI/NO -->
      <div class="section-toggle-wrap">
        <label style="margin-top:0;">¿Procedimiento cuenta con intervinientes?</label>
        <label class="checkbox-label">
          <input type="checkbox" id="f_tieneIntervinientes" ${tieneIntervChecked} onchange="toggleIntervSection(this.checked)"> Sí, agregar intervinientes
        </label>

window.toggleIntervSection = function(isChecked) {
  const section = document.getElementById('intervinientesSection');
  section.style.display = isChecked ? 'block' : 'none';
  if (isChecked && document.querySelectorAll('.interv-block').length === 0) {
    const isOS1 = (state.module === 'm3');
    addIntervRow(null, isOS1);
  }
  verificarSiHayDetenido();
};

window.toggleMpSection = function(isChecked) {
  const container = document.getElementById('mpMainContainer');
  container.style.display = isChecked ? 'block' : 'none';
};

window.toggleMpPendiente = function(isPendiente) {
  const container = document.getElementById('mpCamposContainer');
  if(container) container.style.display = isPendiente ? 'none' : 'block';
};

window.toggleControlDetencion = function(isChecked) {
  const tipoWrap = document.getElementById('tipoControlWrap');
  if(tipoWrap) tipoWrap.style.display = isChecked ? 'block' : 'none';
};

window.verificarSiHayDetenido = function() {
  const tieneInterv = document.getElementById('f_tieneIntervinientes') ? document.getElementById('f_tieneIntervinientes').checked : false;
  let hayDetenido = false;

  if (tieneInterv) {
    const tipos = document.querySelectorAll('[id^="i_tipo_"]');
    tipos.forEach(select => {
      if (select.value === 'DETENIDO') hayDetenido = true;
    });
  }

  const detenidoWrap = document.getElementById('detenidoControlWrap');
  if (detenidoWrap) {
    if (hayDetenido) {
      detenidoWrap.classList.add('show');
      const pasaCtrl = document.getElementById('f_pasaControl').checked;
      document.getElementById('tipoControlWrap').style.display = pasaCtrl ? 'block' : 'none';
    } else {
      detenidoWrap.classList.remove('show');
      document.getElementById('f_pasaControl').checked = false;
      document.getElementById('tipoControlWrap').style.display = 'none';
    }
  }
};

window.toggleMigratoryStatus = function(id) {
  const nac = document.getElementById(`i_nac_${id}`).value.trim().toLowerCase();
  const wrap = document.getElementById(`mig_wrap_${id}`);
  if (!nac.includes('chilen') && nac !== '') {
    wrap.style.display = 'block';
  } else {
    wrap.style.display = 'none';
    document.getElementById(`i_mig_${id}`).value = '';
  }
};

window.toggleConditionalFields = function(id, tipoSeleccionado) {
  const lesionesWrap = document.getElementById(`lesiones_wrap_${id}`);
  const temperanciaWrap = document.getElementById(`temperancia_wrap_${id}`);
  
  if (lesionesWrap) lesionesWrap.classList.remove('show');
  if (temperanciaWrap) temperanciaWrap.classList.remove('show');
  
  if (tipoSeleccionado === 'LESIONADO' && lesionesWrap) {
    lesionesWrap.classList.add('show');
  }
  if (tipoSeleccionado === 'CONDUCTOR' && temperanciaWrap) {
    temperanciaWrap.classList.add('show');
  }

  verificarSiHayDetenido();
};

function collectInterv(isOS1) {
  const tieneInterv = document.getElementById('f_tieneIntervinientes').checked;
  if (!tieneInterv) return [];

  return Array.from(document.querySelectorAll('.interv-block')).map(n => {
    const id = n.id.split('_')[1];
    const nac = document.getElementById(`i_nac_${id}`).value.trim();
    let mig = '';
    
    if(!nac.toLowerCase().includes('chilen') && nac !== '') {
        mig = document.getElementById(`i_mig_${id}`).value;
    }

    let obj = {
      tipo: document.getElementById(`i_tipo_${id}`).value,
      nombre: document.getElementById(`i_nombre_${id}`).value.trim(),
      rut: document.getElementById(`i_rut_${id}`) ? document.getElementById(`i_rut_${id}`).value.trim() : '',
      edad: document.getElementById(`i_edad_${id}`).value.trim(),
      nacionalidad: nac,
      migratoria: mig,
      antecedentes: document.getElementById(`i_ant_${id}`).value.trim(),
    };
    
    const lesionesEl = document.getElementById(`i_lesiones_${id}`);
    const caracterEl = document.getElementById(`i_caracter_lesiones_${id}`);
    if (lesionesEl) obj.lesiones = lesionesEl.value.trim();
    if (caracterEl) obj.caracterLesiones = caracterEl.value.trim();
    
    const temperanciaEl = document.getElementById(`i_temperancia_${id}`);
    if (temperanciaEl) obj.temperancia = temperanciaEl.value.trim();
    
    if (isOS1) obj.vehiculo = document.getElementById(`i_veh_${id}`).value.trim();
    else obj.tipoVehiculo = document.getElementById(`i_tipoveh_${id}`).value;
    
    return obj;
  }).filter(i => i.nombre);
}

function generateDraft(targetMod) {
  if (targetMod) {
    state.module = targetMod;
  }
  const mod = state.module;
  let data = {}, output = '', titulo = '';

  if (mod === 'm1' || mod === 'm3') {
    const tieneInterv = document.getElementById('f_tieneIntervinientes').checked;
    const tomaMp = document.getElementById('f_tomaConocimientoMp').checked;
    const mpPendiente = document.getElementById('f_mpPendiente').checked;
    const pasaControlEl = document.getElementById('f_pasaControl');
    
    const intervArray = collectInterv(mod === 'm3');
    const hayDetenido = intervArray.some(i => i.tipo === 'DETENIDO');

    data = {
      titulo: document.getElementById('f_titulo').value,
      prefectura: document.getElementById('f_prefectura').value,
      unidad: document.getElementById('f_unidad').value,
      comuna: document.getElementById('f_comuna').value,
      hora: document.getElementById('f_hora').value,
      relato: document.getElementById('f_relato').value,
      tieneIntervinientes: tieneInterv,
      tieneDetenido: hayDetenido,
      tomaConocimientoMp: tomaMp,
      mpPendiente: mpPendiente,
      fiscal: (!tomaMp || mpPendiente) ? '' : document.getElementById('f_fiscal').value,
      folio: (!tomaMp || mpPendiente) ? '' : document.getElementById('f_folio').value,
      pasaControl: (tomaMp && pasaControlEl) ? pasaControlEl.checked : false,
      tipoControl: (tomaMp && pasaControlEl && pasaControlEl.checked) ? document.getElementById('f_tipoControl').value : '',
      instrucciones: (!tomaMp || mpPendiente) ? '' : document.getElementById('f_instrucciones').value,
      enDesarrollo: document.getElementById('f_enDesarrollo').checked,
      informaOS1: mod === 'm1' ? document.getElementById('f_informaOS1').checked : false,
      remitente: document.getElementById('f_remitente').value,
      telefono: document.getElementById('f_telefono').value,
      intervinientes: intervArray
    };
    
    if (mod === 'm1') {
      output = generateModulo1(data);
      titulo = data.titulo + ' - ' + data.comuna;
    } else {
      output = buildOS1Base(data); 
      titulo = 'OS1 - ' + data.titulo;
    }
  } else if (mod === 'm2') {
    data = { relato: document.getElementById('f_relato').value, mp: document.getElementById('f_mp').value };
    output = generateModulo2(data);
    titulo = 'Ampliación';
  }

  state.draft = { data, output, titulo: titulo, mod: mod };
  state.view = 'review';
  render();
}

function generateOS1Draft(id) {
  const m = cachedMsgs.find(x => x.id === id);
  if (!m) return;
  
  state.module = 'm3';
  const baseOS1 = buildOS1Base(m.data);
  state.draft = {
    mod: 'm3',
    data: JSON.parse(JSON.stringify(m.data)),
    titulo: 'Mensaje OS1 - ' + (m.titulo || ''),
    output: baseOS1
  };
  
  // ESTO EVITA QUE EL MENSAJE OS1 BORRE EL MENSAJE ORIGINAL EN EL HISTORIAL
  state.editId = null; 
  
  state.view = 'review';
  render();
}

async function correctWithAI(isOS1) {
  const statusEl = document.getElementById('aiStatus');
  const textarea = document.getElementById('reviewText');
  
  if (!textarea.value.trim()) {
    statusEl.textContent = '⚠️ El texto está vacío.';
    return;
  }

  statusEl.textContent = isOS1 ? 'Formalizando con IA...' : 'Mejorando redacción...';
  
  try {
    // CORREGIDO: Se reestableció la ruta original /api/gemini
    const resp = await fetch('/api/gemini', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: textarea.value })
    });

    const contentType = resp.headers.get("content-type");
    if (contentType && contentType.indexOf("application/json") !== -1) {
      const data = await resp.json();
      
      if (!resp.ok) {
        throw new Error(data.error || `HTTP ${resp.status}`);
      }

      if (!data.corrected) {
        throw new Error('Respuesta inválida de la API');
      }

      textarea.value = data.corrected.trim();
      statusEl.textContent = '✅ Texto optimizado correctamente.';
    } else {
      throw new Error(`Error de servidor. Vercel respondió con un formato no válido (Posible caché pendiente, haz Ctrl+F5).`);
    }
    
  } catch (error) {
    statusEl.textContent = '❌ Error: ' + error.message;
    console.error('AI Error:', error);
  }
}

async function confirmAndSave(event) {
  try {
    if (event && event.target) {
      event.target.innerText = "⏳ Guardando en base de datos...";
      event.target.disabled = true;
    }

    state.draft.output = document.getElementById('reviewText').value;
    const moduleToSave = state.draft.mod === 'm3os1' ? 'm3' : state.draft.mod;
    
    state.editId = await saveMessage({ 
      data: state.draft.data, 
      output: state.draft.output, 
      titulo: state.draft.titulo, 
      module: moduleToSave 
    }, state.editId);
    
    await loadMessages();
    
    state.draft = null;
    state.view = 'view';
    render();

  } catch (error) {
    alert("Hubo un error al guardar en la base de datos de Firebase: \n\n" + error.message);
    if (event && event.target) {
      event.target.innerText = "💾 Guardar";
      event.target.disabled = false;
    }
  }
}

function copyToClipboard() {
  const text = document.getElementById('finalOutput').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  });
}
