<style>
  :root {
    --navy: #0b1224; --navy2: #141f3d; --gold: #e8b13c; --gold2: #f3d08a;
    --teal: #3fc7c7; --white: #f1f1f1; --border: #2a3a5c; --danger: #e57373; --wsp: #25D366;
  }
  * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
  body { margin: 0; background: radial-gradient(circle at top, #10193a, #060a17 100%); color: var(--white); min-height: 100vh; }
  .container { max-width: 500px; margin: 0 auto; padding: 20px 16px 60px; position: relative; }

  h1 { text-align: center; font-size: 24px; background: linear-gradient(90deg, var(--gold2), var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 10px 0 24px; text-transform: uppercase; }
  h2 { color: var(--gold2); font-size: 16px; margin-top: 24px; border-bottom: 1px solid var(--border); padding-bottom: 6px; text-transform: uppercase;}

  label { display: block; margin: 16px 0 6px; color: var(--teal); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  input, select, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--navy); color: var(--white); font-size: 15px; outline: none; transition: border 0.3s; }
  input:focus, textarea:focus, select:focus { border-color: var(--teal); }
  textarea { min-height: 180px; resize: vertical; font-weight: bold; }
  .checkbox-label { display: flex; align-items: center; gap: 10px; cursor: pointer; text-transform: none; color: var(--white); font-weight: normal; font-size: 14px;}
  .checkbox-label input { width: auto; transform: scale(1.2); }

  input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }

  button { cursor: pointer; border: 1px solid var(--gold); background: transparent; color: var(--gold2); padding: 12px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; transition: all 0.2s; width: 100%; margin-top: 10px; }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-primary { background: linear-gradient(90deg, var(--gold), var(--gold2)); color: var(--navy); border: none; box-shadow: 0 4px 15px rgba(232, 177, 60, 0.2); }
  .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }
  .btn-outline { background: transparent; border: 1px solid var(--gold); color: var(--gold2); font-weight: normal; }
  .btn-outline:hover { background: rgba(232, 177, 60, 0.1); }

  .btn-whatsapp { background: var(--wsp); color: white; border: none; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.2); font-weight: bold; }
  .btn-whatsapp:hover { background: #1ebd5a; color: white; }

  .btn-row { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .btn-row button { flex: 1; min-width: 80px; margin-top: 0; padding: 14px 8px; font-size: 13px; display: flex; align-items: center; justify-content: center; text-align: center; }
  .btn-text { background: none; border: none; color: var(--teal); text-decoration: underline; padding: 8px; font-weight: normal; }
  .btn-text.inline-link { width: auto; margin: 0; padding: 0 4px; font-size: inherit; }
  .btn-danger { border-color: var(--danger); color: var(--danger); }

  .card { border: 1px solid var(--border); background: rgba(20, 31, 61, 0.7); border-radius: 12px; padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); backdrop-filter: blur(4px); margin-bottom: 16px; }
  .interv-block, .especie-block { border-left: 3px solid var(--teal); background: rgba(11, 18, 36, 0.8); border-radius: 0 8px 8px 0; padding: 16px; margin-top: 12px; position: relative; }
  .especie-block { border-left-color: var(--gold); }
  .remove-btn { position: absolute; top: 12px; right: 12px; width: auto; padding: 4px 10px; font-size: 11px; border-color: var(--danger); color: var(--danger); margin: 0; }
  .tag { display: inline-block; font-size: 11px; color: var(--teal); border: 1px solid var(--teal); border-radius: 20px; padding: 3px 10px; margin-bottom: 8px; font-weight: 600;}

  .module-select { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
  .module-select button { padding: 20px 10px; font-size: 14px; line-height: 1.4; height: 100%; border-radius: 12px; }

  pre.output { white-space: pre-wrap; background: #050812; border: 1px solid var(--border); border-radius: 8px; padding: 16px; font-family: 'Courier New', monospace; font-size: 14px; color: #e8e8e8; line-height: 1.5; max-height: 60vh; overflow-y: auto; font-weight: bold; }
  #reviewText { font-family: 'Courier New', monospace; min-height: 450px; font-size: 14px; line-height: 1.5; font-weight: bold; }

  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .top-bar span { font-size: 14px; color: #8fa0c4; }
  .top-bar button { width: auto; margin: 0; padding: 6px 12px; border: none; font-size: 13px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--teal); color: var(--navy); padding: 10px 20px; border-radius: 20px; font-weight: bold; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 1000; }
  .toast.show { opacity: 1; }
  .loading { text-align: center; padding: 60px 0; color: #8fa0c4; font-size: 16px; }
  .logo-container { text-align: center; margin-bottom: 10px; }
  .logo-container img { width: 100px; opacity: 0.95; }
  .logo-subtitle { display: block; letter-spacing: 3px; color: var(--gold2); font-size: 11px; margin-top: 8px; text-transform: uppercase;}

  .conditional-field { display: none; background: rgba(63, 199, 199, 0.1); padding: 12px; border-radius: 6px; margin-top: 10px; border-left: 3px solid var(--teal); }
  .conditional-field.show { display: block; }
  .section-toggle-wrap { background: rgba(20, 31, 61, 0.5); padding: 12px; border-radius: 8px; border: 1px solid var(--border); margin-top: 16px; }

  .field-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
  .field-actions { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
  .icon-btn { width: 36px; height: 36px; padding: 0; border-radius: 50%; font-size: 18px; margin: 0; display: flex; align-items: center; justify-content: center; border-color: var(--teal); color: var(--teal); flex-shrink: 0; }
  .ai-btn { width: auto; margin: 0; padding: 7px 12px; font-size: 12px; border-radius: 18px; white-space: nowrap; }
  .ai-status { font-size: 12px; color: #8fa0c4; margin-top: 6px; min-height: 16px; }
  .hint { font-size: 12px; color: #8fa0c4; margin-top: 6px; line-height: 1.4; }
  .banner { border: 1px solid var(--gold); background: rgba(232, 177, 60, 0.08); border-radius: 12px; padding: 14px; margin: 16px 0; font-size: 14px; }
  .banner.error { border-color: var(--danger); background: rgba(229, 115, 115, 0.08); }
</style>

<body>
<div class="container" id="app"><div class="loading">Cargando plataforma...</div></div>
<div id="toast" class="toast">Texto copiado al portapapeles</div>

<script>
/* --- 1. CONFIGURACIÓN FIREBASE --- */
const firebaseConfig = {
  apiKey: "AIzaSyB7EJn3DjG4tsdU2-8m15uhRaD2PSlnUrg",
  authDomain: "mensajes-carabineros-app.firebaseapp.com",
  projectId: "mensajes-carabineros-app",
  storageBucket: "mensajes-carabineros-app.firebasestorage.app",
  messagingSenderId: "97537422358",
  appId: "1:97537422358:web:a2b6eb9623d9c6d0b97137"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const DOMINIO_INSTITUCIONAL = '@carabineros.cl';
const CAT = window.CATALOGOS || {};

/* --- 2. ESTADO GLOBAL --- */
let state = { view: 'login', editId: null, module: null, currentUser: null, draft: null, loadError: null };
let cachedMsgs = [];
const app = document.getElementById('app');

/* --- UTILIDADES --- */
// Escapa texto antes de insertarlo en HTML (evita que comillas o "<" rompan los campos)
function esc(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function esCorreoInstitucional(email) {
  return (email || '').toLowerCase().endsWith(DOMINIO_INSTITUCIONAL);
}

// Une un texto con punto final sin duplicarlo
function conPunto(text) {
  return text.replace(/[.\s]+$/, '') + '.';
}

/* --- RECONOCIMIENTO DE VOZ NATIVO --- */
let recognition = null;
let isDictating = false;

window.toggleDictation = function(targetId, btnId) {
  const btn = document.getElementById(btnId);
  const targetInput = document.getElementById(targetId);

  if (isDictating) {
    if (recognition) recognition.stop();
    return;
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert("Tu navegador no soporta el dictado por voz. Te sugerimos usar Google Chrome, Edge o Safari actualizados.");
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = 'es-CL';
  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onstart = function() {
    isDictating = true;
    btn.style.background = 'var(--danger)';
    btn.style.borderColor = 'var(--danger)';
    btn.style.color = '#fff';
  };

  recognition.onresult = function(event) {
    let transcript = '';
    for (let i = event.resultIndex; i < event.results.length; ++i) {
      transcript += event.results[i][0].transcript + ' ';
    }
    const currentText = targetInput.value;
    const separator = (currentText.length > 0 && !currentText.endsWith(' ') && !currentText.endsWith('\n')) ? ' ' : '';
    targetInput.value = currentText + separator + transcript.trim();
    targetInput.dispatchEvent(new Event('input', { bubbles: true }));
  };

  recognition.onerror = function(event) {
    console.error("Error de voz: ", event.error);
    stopDictationUI(btn);
  };

  recognition.onend = function() {
    stopDictationUI(btn);
  };

  recognition.start();
};

function stopDictationUI(btn) {
  isDictating = false;
  btn.style.background = '';
  btn.style.borderColor = '';
  btn.style.color = '';
}


/* --- 3. AUTENTICACIÓN --- */
auth.onAuthStateChanged(async (user) => {
  if (user && !esCorreoInstitucional(user.email)) {
    alert("ACCESO DENEGADO: Solo se permite el acceso con correos institucionales (" + DOMINIO_INSTITUCIONAL + ").");
    await auth.signOut();
    return;
  }

  state.currentUser = user || null;
  if (user && user.emailVerified) {
    state.view = 'dashboard';
    await loadMessages();
  } else if (user) {
    state.view = 'verify';
  } else {
    state.view = 'login';
    cachedMsgs = [];
  }
  render();
});

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  try { await auth.signInWithEmailAndPassword(email, pass); }
  catch(e) { alert("Error de acceso: Verifica tus credenciales."); }
}

async function doRegister() {
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const pass = document.getElementById('loginPass').value;

  if (!esCorreoInstitucional(email)) {
    alert("ACCESO DENEGADO: Por medidas de seguridad, solo se permite el registro con correos institucionales (" + DOMINIO_INSTITUCIONAL + ").");
    return;
  }
  if (pass.length < 6) {
    alert("La clave debe tener al menos 6 caracteres.");
    return;
  }

  try {
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    await cred.user.sendEmailVerification();
  } catch(e) {
    if (e.code === 'auth/email-already-in-use') {
      alert("Este correo institucional ya está registrado. Intenta ingresar con tu clave.");
    } else {
      alert("Error al registrar: " + e.message);
    }
  }
}

async function checkVerified() {
  const user = auth.currentUser;
  if (!user) return;
  await user.reload();
  if (!auth.currentUser.emailVerified) {
    alert("Tu correo aún no aparece verificado. Abre el enlace que te enviamos y vuelve a intentarlo.");
    return;
  }
  // Refresca el token para que la base de datos reconozca la verificación
  await auth.currentUser.getIdToken(true);
  state.currentUser = auth.currentUser;
  state.view = 'dashboard';
  await loadMessages();
  render();
}

async function resendVerification() {
  try {
    await auth.currentUser.sendEmailVerification();
    alert("Correo de verificación reenviado.");
  } catch (e) {
    if (e.code === 'auth/too-many-requests') {
      alert("Demasiados intentos. Espera unos minutos antes de volver a reenviar.");
    } else {
      alert("No se pudo reenviar el correo: " + e.message);
    }
  }
}

function logout() {
  if (getLocalDraft() && !confirm('Tienes un borrador sin guardar. Al salir se eliminará de este dispositivo. ¿Deseas salir?')) return;
  clearLocalDraft();
  auth.signOut();
}

/* --- 4. BASE DE DATOS (FIRESTORE) --- */
async function loadMessages() {
  state.loadError = null;
  try {
    const snap = await db.collection('messages').where('uid', '==', state.currentUser.uid).get();
    cachedMsgs = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => b.updatedAt - a.updatedAt);
  } catch (error) {
    console.error("Error al cargar mensajes:", error);
    state.loadError = error.code === 'permission-denied'
      ? 'No tienes permiso para ver los registros. Verifica que tu correo institucional esté confirmado.'
      : 'No se pudo cargar el historial. Revisa tu conexión e intenta nuevamente.';
  }
}

async function retryLoad() {
  await loadMessages();
  render();
}

async function saveMessage(msg, editId) {
  const payload = { ...msg, uid: state.currentUser.uid, updatedAt: Date.now() };
  if (editId) {
    await db.collection('messages').doc(editId).update(payload);
    return editId;
  } else {
    payload.createdAt = Date.now();
    const ref = await db.collection('messages').add(payload);
    return ref.id;
  }
}

async function deleteMsg(id) {
  if (!confirm('¿Estás seguro de eliminar definitivamente este procedimiento?')) return;
  await db.collection('messages').doc(id).delete();
  await loadMessages();
  state.view = 'dashboard';
  render();
}

/* --- BORRADOR LOCAL (GUARDADO AUTOMÁTICO) --- */
// Mientras se completa el formulario, los datos se guardan en este dispositivo
// para no perderlos si se bloquea el teléfono, se cierra la app o se corta la señal.
let autosaveTimer = null;

function draftKey() {
  return state.currentUser ? `mo_borrador_${state.currentUser.uid}` : null;
}

function writeLocalDraft(module, data) {
  const key = draftKey();
  if (!key) return;
  try {
    localStorage.setItem(key, JSON.stringify({ module, editId: state.editId, data, savedAt: Date.now() }));
  } catch (e) { /* almacenamiento local no disponible */ }
}

function saveLocalDraft() {
  clearTimeout(autosaveTimer);
  if (state.view !== 'form' || !state.module) return;
  writeLocalDraft(state.module, readFormData(state.module));
}

function scheduleAutosave() {
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(saveLocalDraft, 600);
}

function getLocalDraft() {
  const key = draftKey();
  if (!key) return null;
  try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
}

function clearLocalDraft() {
  clearTimeout(autosaveTimer);
  const key = draftKey();
  if (!key) return;
  try { localStorage.removeItem(key); } catch (e) { /* sin acción */ }
}

function confirmDiscardDraft() {
  if (!getLocalDraft()) return true;
  if (!confirm('Tienes un borrador sin guardar. Si continúas se descartará. ¿Deseas continuar?')) return false;
  clearLocalDraft();
  return true;
}

function resumeLocalDraft() {
  const ld = getLocalDraft();
  if (!ld) return render();
  state.module = ld.module;
  state.editId = (ld.editId && cachedMsgs.some(m => m.id === ld.editId)) ? ld.editId : null;
  state.draft = { data: ld.data || {}, mod: ld.module };
  state.view = 'form';
  render();
}

function discardLocalDraft() {
  if (!confirm('¿Descartar definitivamente el borrador?')) return;
  clearLocalDraft();
  render();
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) saveLocalDraft();
});

/* --- 5. LÓGICAS DE GENERACIÓN DE TEXTO --- */
function toInitials(name) {
  if (!name) return '';
  return name.trim().split(/\s+/).map(w => w[0].toUpperCase() + '.').join('');
}

function formatLugar(d) {
  return [d.direccion, d.comuna].map(x => (x || '').trim()).filter(Boolean).join(', ');
}

function especieParts(e) {
  const cabecera = [e.cantidad, e.tipo].map(x => (x || '').trim()).filter(Boolean).join(' ');
  return [cabecera, (e.descripcion || '').trim()].filter(Boolean);
}

function tieneEspeciesValidas(d) {
  return d.tieneEspecies && d.especies && d.especies.length > 0;
}

function generateModulo1(d) {
  let formatTitle = (d.titulo || 'PROCEDIMIENTO').toUpperCase();
  let formatPref = (d.prefectura || 'PREFECTURA').toUpperCase().replace(/SANTIAGO/g, 'STGO.');
  if (!formatPref.includes('PREFECTURA') && !formatPref.includes('PREF') && formatPref !== 'PREFECTURA') {
      formatPref = 'PREFECTURA ' + formatPref;
  }
  let formatUni = (d.unidad || 'UNIDAD').toUpperCase().replace(/COMISAR[IÍ]A/g, 'COM.');

  const title = `*${formatTitle} - ${formatPref} - ${formatUni}*`;
  const lugar = formatLugar(d);
  const lugarLine = lugar ? `*LUGAR:* ${conPunto(lugar)}` : '';
  const body = `${d.hora || '--:--'} hrs.\n${d.relato || ''}`.trim();

  let intervLines = '';
  if (d.tieneIntervinientes && d.intervinientes && d.intervinientes.length > 0) {
    intervLines = d.intervinientes.map(i => {
      let parts = [toInitials(i.nombre)];
      if (i.edad) parts.push(`${i.edad} años`);

      if (i.nacionalidad) {
          let nacText = i.nacionalidad;
          if (i.migratoria && i.migratoria !== '') {
              nacText += ` (Sit. ${i.migratoria})`;
          }
          parts.push(nacText);
      }

      if (i.antecedentes) parts.push(`Ant: ${i.antecedentes}`);

      if (i.lesiones) {
        parts.push(`Lesiones: ${i.lesiones}`);
        if (i.caracterLesiones) parts.push(`Carácter: ${i.caracterLesiones}`);
      }

      if (i.temperancia) {
        parts.push(`Temperancia: ${i.temperancia}`);
      }

      return `*${(i.tipo || 'INTERVINIENTE').toUpperCase()}:* ${parts.join(', ')}.`;
    }).join('\n');
  }

  let especiesLines = '';
  if (tieneEspeciesValidas(d)) {
    especiesLines = d.especies.map(e =>
      `*ESPECIE ${(e.condicion || 'Incautada').toUpperCase()}:* ${conPunto(especieParts(e).join(', '))}`
    ).join('\n');
  }

  let mpText = '';
  if (!d.tomaConocimientoMp) {
    mpText = '*MINISTERIO PÚBLICO:* No toma conocimiento.';
  } else if (d.mpPendiente) {
    mpText = '*MINISTERIO PÚBLICO:* En espera de instrucciones.';
  } else {
    let controlDetails = '';
    if (d.tieneDetenido) {
      if (d.pasaControl) {
        controlDetails = ` Pasa a ${d.tipoControl || 'control de detención'}.`;
      } else {
        controlDetails = ` No pasa a control de detención.`;
      }
    }
    mpText = `*MINISTERIO PÚBLICO:* Fiscal ${d.fiscal || '—'}, Folio ${d.folio || '—'}.${controlDetails} ${d.instrucciones || ''}`.trim();
  }

  const tags = [];
  if (d.enDesarrollo) tags.push('*Procedimiento en Desarrollo*');
  tags.push(d.informaOS1 ? '*Se informa OS1*' : '*No se informa OS1*');

  return [title, lugarLine, body, intervLines, especiesLines, mpText, tags.join('\n')].filter(Boolean).join('\n\n');
}

function generateModulo2(d) {
  const body = (d.relato || '').trim();
  const mp = d.mp ? `*MINISTERIO PÚBLICO:* ${d.mp}` : '';
  return ['*AMPLIACIÓN*', body, mp, '*Se amplía mensaje a OS1.*'].filter(Boolean).join('\n\n');
}

function buildOS1Base(d) {
  const titulo = (d.titulo || 'PROCEDIMIENTO POLICIAL').toUpperCase();
  const comuna = (d.comuna || 'COMUNA NO ESPECIFICADA').toUpperCase();
  const direccion = (d.direccion || '').trim().toUpperCase();
  const lugarTxt = direccion ? `EN ${direccion}, COMUNA DE ${comuna}` : `EN LA COMUNA DE ${comuna}`;
  const hora = d.hora || '--:--';
  const relato = (d.relato || '').toUpperCase();

  let intervText = '';
  if (d.tieneIntervinientes && d.intervinientes && d.intervinientes.length > 0) {
    intervText = d.intervinientes.map(i => {
      const parts = [`- ${(i.tipo || 'INTERVINIENTE').toUpperCase()}: ${i.nombre.toUpperCase()}`];
      if (i.rut) parts.push(`CÉDULA DE IDENTIDAD / PASAPORTE: ${i.rut.toUpperCase()}`);
      if (i.edad) parts.push(`EDAD: ${i.edad} AÑOS`);

      if (i.nacionalidad) {
          let nacText = `NACIONALIDAD: ${i.nacionalidad.toUpperCase()}`;
          if (i.migratoria && i.migratoria !== '') {
              nacText += ` (SITUACIÓN ${i.migratoria.toUpperCase()})`;
          }
          parts.push(nacText);
      }

      if (i.antecedentes) parts.push(`ANTECEDENTES PENALES: ${i.antecedentes.toUpperCase()}`);
      if (i.vehiculo) parts.push(`VEHÍCULO: ${i.vehiculo.toUpperCase()}`);

      if (i.lesiones) {
        parts.push(`LESIONES: ${i.lesiones.toUpperCase()}`);
        if (i.caracterLesiones) parts.push(`CARÁCTER DE LESIONES: ${i.caracterLesiones.toUpperCase()}`);
      }

      if (i.temperancia) {
        parts.push(`ESTADO DE TEMPERANCIA ALCOHÓLICA: ${i.temperancia.toUpperCase()}`);
      }

      return parts.join(', ');
    }).join('\n');
  }

  let especiesText = '';
  if (tieneEspeciesValidas(d)) {
    especiesText = d.especies.map(e =>
      `- ${(e.condicion || 'Incautada').toUpperCase()}: ${especieParts(e).join(', ').toUpperCase()}`
    ).join('\n');
  }

  let mpText = '';
  if (!d.tomaConocimientoMp) {
    mpText = 'NO TOMA CONOCIMIENTO.';
  } else if (d.mpPendiente) {
    mpText = 'EL MINISTERIO PÚBLICO SE ENCUENTRA EN ESPERA DE INSTRUCCIONES.';
  } else {
    let controlDetails = '';
    if (d.tieneDetenido) {
      if (d.pasaControl) {
        controlDetails = ` PASA A ${(d.tipoControl || 'CONTROL DE DETENCIÓN').toUpperCase()}.`;
      } else {
        controlDetails = ` NO PASA A CONTROL DE DETENCIÓN.`;
      }
    }
    mpText = `SE DIO CUENTA AL FISCAL ${(d.fiscal || '—').toUpperCase()}, QUEDANDO REGISTRADO BAJO EL FOLIO ${(d.folio || '—').toUpperCase()}.${controlDetails} INSTRUCCIONES: ${(d.instrucciones || '').toUpperCase()}`;
  }

  const estadoDesarrollo = d.enDesarrollo ? 'EL PROCEDIMIENTO SE MANTIENE EN DESARROLLO. ' : '';

  const cierre = d.enDesarrollo
    ? 'ES TODO CUANTO SE INFORMA AMPLIANDO ANTECEDENTES POSTERIORMENTE.'
    : 'ES TODO CUANTO SE INFORMA.';

  const partes = [
    `MEDIANTE EL PRESENTE DOCUMENTO Y DE CONFORMIDAD AL PROCEDIMIENTO POLICIAL DE ${titulo}, OCURRIDO ${lugarTxt}, APROXIMADAMENTE A LAS ${hora} HORAS. SE INFORMA QUE: ${relato}`,
    intervText ? `ANTECEDENTES DE LOS INTERVINIENTES:\n${intervText}` : '',
    especiesText ? `ESPECIES INCAUTADAS Y/O RECUPERADAS:\n${especiesText}` : '',
    `INSTRUCCIONES DEL MINISTERIO PÚBLICO:\n${mpText}`,
    `${estadoDesarrollo}${cierre}`,
    (d.remitente || '').toUpperCase(),
    (d.telefono || '').toUpperCase()
  ];

  return partes.filter(x => x !== undefined && x.trim() !== '').join('\n\n').replace(/\n{3,}/g, '\n\n').trim();
}

function moduleName(mod) {
  return { m1: 'WhatsApp Procedimiento', m2: 'Ampliación', m3: 'Mensaje OS1' }[mod] || mod;
}

/* --- 6. RENDERIZADO DE INTERFAZ Y ROUTER --- */
function render() {
  if (!state.currentUser) return renderLogin();
  if (!state.currentUser.emailVerified) return renderVerify();

  if (state.view === 'moduleSelect') return renderModuleSelect();
  if (state.view === 'form') return renderForm();
  if (state.view === 'review') return renderReview();
  if (state.view === 'view') return renderView();

  renderDashboard();
}

function goDashboard() {
  state.view = 'dashboard';
  state.draft = null;
  state.editId = null;
  render();
}

function startNew(mod) {
  if (!confirmDiscardDraft()) return;
  state.module = mod;
  state.editId = null;
  state.draft = null;
  state.view = 'form';
  render();
}

function openMsg(id) {
  const m = cachedMsgs.find(x => x.id === id);
  if (!m) return;
  state.module = m.module;
  state.editId = id;
  state.draft = null;
  state.view = 'view';
  render();
}

function editMsg(id) {
  const m = cachedMsgs.find(x => x.id === id);
  if (!m || !confirmDiscardDraft()) return;
  state.module = m.module;
  state.editId = id;
  state.draft = null;
  state.view = 'form';
  render();
}

function cancelForm() {
  if (getLocalDraft() && !confirm('¿Descartar los cambios no guardados?')) return;
  clearLocalDraft();
  goDashboard();
}

// Sugerencias = valores ya usados por el usuario + catálogo base
function sugerencias(base, campo) {
  const usados = cachedMsgs
    .map(m => m.data && m.data[campo])
    .filter(v => typeof v === 'string' && v.trim())
    .map(v => v.trim());
  return [...new Set([...usados, ...(base || [])])];
}

function datalistHTML(id, values) {
  return `<datalist id="${id}">${values.map(v => `<option value="${esc(v)}">`).join('')}</datalist>`;

  return `

      <div class="field-actions">
        ${aiBtn}
        <button type="button" id="btn_mic_${fieldId}" onclick="toggleDictation('${fieldId}', 'btn_mic_${fieldId}')" class="btn-outline icon-btn" title="Dictar por voz">🎤</button>

    </div>`;
}

window.toggleIntervSection = function(isChecked) {
  const section = document.getElementById('intervinientesSection');
  section.style.display = isChecked ? 'block' : 'none';
  if (isChecked && document.querySelectorAll('.interv-block').length === 0) {
    addIntervRow(null, false);
  }
  verificarSiHayDetenido();
};

window.toggleEspeciesSection = function(isChecked) {
  const section = document.getElementById('especiesSection');
  section.style.display = isChecked ? 'block' : 'none';
  if (isChecked && document.querySelectorAll('.especie-block').length === 0) {
    addEspecieRow(null);
  }
};

window.toggleMpSection = function(isChecked) {
  const container = document.getElementById('mpMainContainer');
  container.style.display = isChecked ? 'block' : 'none';
};

window.toggleMpPendiente = function(isPendiente) {
  const container = document.getElementById('mpCamposContainer');
  if(container) container.style.display = isPendiente ? 'none' : 'block';
};

window.toggleControlDetencion = function(isChecked) {
  const tipoWrap = document.getElementById('tipoControlWrap');
  if(tipoWrap) tipoWrap.style.display = isChecked ? 'block' : 'none';
};

window.verificarSiHayDetenido = function() {
  const tieneInterv = document.getElementById('f_tieneIntervinientes') ? document.getElementById('f_tieneIntervinientes').checked : false;
  let hayDetenido = false;

  if (tieneInterv) {
    const tipos = document.querySelectorAll('[id^="i_tipo_"]');
    tipos.forEach(select => {
      if (select.value === 'DETENIDO') hayDetenido = true;
    });
  }

  const detenidoWrap = document.getElementById('detenidoControlWrap');
  if (detenidoWrap) {
    if (hayDetenido) {
      detenidoWrap.classList.add('show');
      const pasaCtrl = document.getElementById('f_pasaControl').checked;
      document.getElementById('tipoControlWrap').style.display = pasaCtrl ? 'block' : 'none';
    } else {
      detenidoWrap.classList.remove('show');
      document.getElementById('f_pasaControl').checked = false;
      document.getElementById('tipoControlWrap').style.display = 'none';
    }
  }
};

window.toggleMigratoryStatus = function(id) {
  const nac = document.getElementById(`i_nac_${id}`).value.trim().toLowerCase();
  const wrap = document.getElementById(`mig_wrap_${id}`);
  if (!nac.includes('chilen') && nac !== '') {
    wrap.style.display = 'block';
  } else {
    wrap.style.display = 'none';
    document.getElementById(`i_mig_${id}`).value = '';
  }
};

window.removeBlock = function(blockId) {
  const el = document.getElementById(blockId);
  if (el) el.remove();
  verificarSiHayDetenido();
  scheduleAutosave();
};

let especieCounter = 0;

  e = e || {};

  especieCounter++;
  const id = especieCounter;
  const div = document.createElement('div');
  div.className = 'especie-block';
  div.id = `especie_${id}`;

  const condiciones = CAT.condicionesEspecie || ['Incautada', 'Recuperada'];
  const condicionActual = e.condicion || condiciones[0];

  div.innerHTML = `
    <button class="remove-btn" onclick="removeBlock('${div.id}')">Quitar</button>
    <div style="display:flex; gap:10px;">
      <div style="flex:1">
        <label>Condición</label>
        <select id="e_cond_${id}">
          ${condiciones.map(c => `<option value="${esc(c)}" ${condicionActual===c?'selected':''}>${esc(c)}</option>`).join('')}
        </select>
      </div>
      <div style="flex:1">
        <label>Cantidad</label>
        <input id="e_cant_${id}" value="${esc(e.cantidad)}" placeholder="Ej: 01">
      </div>
    </div>

    <label>Tipo de Especie</label>
    <input id="e_tipo_${id}" list="dl_tipos_especie" autocomplete="off" value="${esc(e.tipo)}" placeholder="Ej: Arma de fuego">

    <label>Descripción</label>
    <input id="e_desc_${id}" value="${esc(e.descripcion)}" placeholder="Marca, modelo, calibre, N° de serie, peso, avalúo...">
  `;
  document.getElementById('especiesWrap').appendChild(div);
}

function collectInterv() {
  const tieneInterv = document.getElementById('f_tieneIntervinientes').checked;
  if (!tieneInterv) return [];

  return Array.from(document.querySelectorAll('.interv-block')).map(n => {
    const id = n.id.split('_')[1];
    const nac = document.getElementById(`i_nac_${id}`).value.trim();
    let mig = '';

    if(!nac.toLowerCase().includes('chilen') && nac !== '') {
        mig = document.getElementById(`i_mig_${id}`).value;
    }

    let obj = {
      tipo: document.getElementById(`i_tipo_${id}`).value,
      nombre: document.getElementById(`i_nombre_${id}`).value.trim(),
      rut: document.getElementById(`i_rut_${id}`) ? document.getElementById(`i_rut_${id}`).value.trim() : '',
      edad: document.getElementById(`i_edad_${id}`).value.trim(),
      nacionalidad: nac,
      migratoria: mig,
      antecedentes: document.getElementById(`i_ant_${id}`).value.trim(),
    };

    const lesionesEl = document.getElementById(`i_lesiones_${id}`);
    const caracterEl = document.getElementById(`i_caracter_lesiones_${id}`);
    if (lesionesEl && lesionesEl.value.trim() !== '') obj.lesiones = lesionesEl.value.trim();
    if (caracterEl && caracterEl.value !== '') obj.caracterLesiones = caracterEl.value;

    const temperanciaEl = document.getElementById(`i_temperancia_${id}`);
    if (temperanciaEl && temperanciaEl.value !== '') obj.temperancia = temperanciaEl.value;

    const vehiculoEl = document.getElementById(`i_veh_${id}`);
    if (vehiculoEl) obj.vehiculo = vehiculoEl.value.trim();

    return obj;
  }).filter(i => i.nombre);
}

function collectEspecies() {
  const tieneEspecies = document.getElementById('f_tieneEspecies').checked;
  if (!tieneEspecies) return [];

  return Array.from(document.querySelectorAll('.especie-block')).map(n => {
    const id = n.id.split('_')[1];
    return {
      condicion: document.getElementById(`e_cond_${id}`).value,
      cantidad: document.getElementById(`e_cant_${id}`).value.trim(),
      tipo: document.getElementById(`e_tipo_${id}`).value.trim(),
      descripcion: document.getElementById(`e_desc_${id}`).value.trim()
    };
  }).filter(e => e.tipo || e.descripcion);
}

// Lee los datos del formulario actual sin cambiar de vista
function readFormData(mod) {
  if (mod === 'm2') {
    return { relato: document.getElementById('f_relato').value, mp: document.getElementById('f_mp').value };
  }

  const tieneInterv = document.getElementById('f_tieneIntervinientes').checked;
  const tieneEspecies = document.getElementById('f_tieneEspecies').checked;
  const tomaMp = document.getElementById('f_tomaConocimientoMp').checked;
  const mpPendiente = document.getElementById('f_mpPendiente').checked;
  const pasaControlEl = document.getElementById('f_pasaControl');

  const informaOS1El = document.getElementById('f_informaOS1');

  const intervArray = collectInterv();
  const hayDetenido = intervArray.some(i => i.tipo === 'DETENIDO');

  return {
    titulo: document.getElementById('f_titulo').value,
    prefectura: document.getElementById('f_prefectura').value,
    unidad: document.getElementById('f_unidad').value,
    comuna: document.getElementById('f_comuna').value,
    direccion: document.getElementById('f_direccion').value,
    hora: document.getElementById('f_hora').value,
    relato: document.getElementById('f_relato').value,
    tieneIntervinientes: tieneInterv,
    tieneDetenido: hayDetenido,
    tieneEspecies: tieneEspecies,
    tomaConocimientoMp: tomaMp,
    mpPendiente: mpPendiente,
    fiscal: (!tomaMp || mpPendiente) ? '' : document.getElementById('f_fiscal').value,
    folio: (!tomaMp || mpPendiente) ? '' : document.getElementById('f_folio').value,
    pasaControl: (tomaMp && pasaControlEl) ? pasaControlEl.checked : false,
    tipoControl: (tomaMp && pasaControlEl && pasaControlEl.checked) ? document.getElementById('f_tipoControl').value : '',
    instrucciones: (!tomaMp || mpPendiente) ? '' : document.getElementById('f_instrucciones').value,
    enDesarrollo: document.getElementById('f_enDesarrollo').checked,
    informaOS1: informaOS1El ? informaOS1El.checked : false,
    remitente: document.getElementById('f_remitente').value,
    telefono: document.getElementById('f_telefono').value,
    intervinientes: intervArray,
    especies: collectEspecies()
  };
}

function generateDraft(targetMod) {
  if (targetMod) {
    state.module = targetMod;
  }
  const mod = state.module;
  const data = readFormData(mod);
  writeLocalDraft(mod, data);

  let output = '', titulo = '';
  if (mod === 'm1') {
    output = generateModulo1(data);
    titulo = data.titulo + ' - ' + data.comuna;
  } else if (mod === 'm3') {
    output = buildOS1Base(data);
    titulo = 'OS1 - ' + data.titulo;
  } else if (mod === 'm2') {
    output = generateModulo2(data);
    titulo = 'Ampliación';
  }

  state.draft = { data, output, titulo: titulo, mod: mod };
  state.view = 'review';
  render();
}

/* --- 8. INTELIGENCIA ARTIFICIAL (SOLO RELATO, CON DATOS PROTEGIDOS) --- */
const aiUndo = {};

function escapeRegex(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// Nombres de intervinientes ingresados en el formulario (completo y "nombre + primer apellido")
function nombresIntervinientes() {
  const nombres = new Set();
  document.querySelectorAll('[id^="i_nombre_"]').forEach(el => {
    const full = el.value.trim().replace(/\s+/g, ' ');
    if (full.length < 3) return;
    nombres.add(full);
    const w = full.split(' ');
    if (w.length >= 3) nombres.add(`${w[0]} ${w[w.length - 2]}`);
  });
  return [...nombres].sort((a, b) => b.length - a.length);
}

// Reemplaza datos personales por marcas [DATO_n] antes de enviar el texto a la IA
function protegerDatos(texto) {
  const mapa = [];
  let out = texto;
  const reemplazar = (regex) => {
    out = out.replace(regex, (valor) => {
      const token = `[DATO_${mapa.length + 1}]`;
      mapa.push({ token, valor });
      return token;
    });
  };

  reemplazar(/\b\d{1,2}\.?\d{3}\.?\d{3}\s?-\s?[\dkK]\b/g);                 // RUT
  reemplazar(/(?:\+?56[\s-]?)?\b9[\s.-]?\d{4}[\s.-]?\d{4}\b/g);            // Teléfonos móviles
  reemplazar(/[\w.+-]+@[\w-]+\.[\w.-]+/g);                                 // Correos
  nombresIntervinientes().forEach(n => reemplazar(new RegExp(escapeRegex(n), 'gi')));

  return { texto: out, mapa };
}

// Devuelve null si la IA eliminó o alteró alguna marca
function restaurarDatos(texto, mapa) {
  let out = texto;
  for (const { token, valor } of mapa) {
    if (!out.includes(token)) return null;
    out = out.split(token).join(valor);
  }
  return out;
}

async function improveWithAI(fieldId) {
  const field = document.getElementById(fieldId);
  const statusEl = document.getElementById('ai_status_' + fieldId);
  const btn = document.getElementById('btn_ai_' + fieldId);
  const original = field.value;

  if (!original.trim()) {
    statusEl.textContent = '⚠️ Escribe el relato antes de mejorarlo.';
    return;
  }

  const { texto, mapa } = protegerDatos(original);
  btn.disabled = true;
  statusEl.textContent = 'Procesando texto con Inteligencia Artificial...';

  try {
    const idToken = await auth.currentUser.getIdToken();
    const resp = await fetch('/api/gemini', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + idToken },
      body: JSON.stringify({ text: texto })
    });

    const contentType = resp.headers.get('content-type') || '';
    if (!contentType.includes('application/json')) {
      throw new Error('El servicio de IA no está disponible en este momento.');
    }
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);
    if (!data.corrected) throw new Error('La IA no devolvió texto.');

    const restaurado = restaurarDatos(data.corrected.trim(), mapa);
    if (restaurado === null) {
      throw new Error('La IA alteró datos protegidos, por lo que se mantuvo el texto original.');
    }

    aiUndo[fieldId] = original;
    field.value = restaurado;
    scheduleAutosave();
    const protegidos = mapa.length ? ` (${mapa.length} dato(s) personal(es) protegido(s))` : '';
    statusEl.innerHTML = `✅ Redacción mejorada${protegidos}. <button type="button" class="btn-text inline-link" onclick="undoAI('${fieldId}')">Deshacer</button>`;
  } catch (error) {
    statusEl.textContent = '❌ ' + error.message;
    console.error('AI Error:', error);
  } finally {
    btn.disabled = false;
  }
}

function undoAI(fieldId) {
  if (aiUndo[fieldId] === undefined) return;
  document.getElementById(fieldId).value = aiUndo[fieldId];
  delete aiUndo[fieldId];
  document.getElementById('ai_status_' + fieldId).textContent = '↩ Se restauró el texto original.';
  scheduleAutosave();
}

/* --- 9. REVISIÓN Y GUARDADO --- */
function renderReview() {
  app.innerHTML = `
    <div class="top-bar"><button class="btn-text" onclick="state.view='form'; render()">← Modificar Datos</button></div>
    <h1>REVISIÓN FINAL</h1>
    <div class="card">
      <label>Texto Generado (Editable)</label>
      <textarea id="reviewText">${esc(state.draft.output)}</textarea>
      <div class="hint">Puedes ajustar el texto antes de guardarlo. Si cambias datos en "Modificar Datos", el texto se vuelve a generar.</div>

      <button class="btn-primary" style="margin-top:24px;" onclick="confirmAndSave(event)">💾 Guardar Procedimiento</button>
    </div>
  `;
}

function generateOS1Draft(id) {
  const m = cachedMsgs.find(x => x.id === id);
  if (!m) return;

  state.module = 'm3';
  const baseOS1 = buildOS1Base(m.data);
  state.draft = {
    mod: 'm3',
    data: JSON.parse(JSON.stringify(m.data)),
    titulo: 'Mensaje OS1 - ' + (m.titulo || ''),
    output: baseOS1
  };
  state.editId = null;
  state.view = 'review';
  render();
}

async function confirmAndSave(event) {
  try {
    if (event && event.target) {
      event.target.innerText = "⏳ Guardando en base de datos...";
      event.target.disabled = true;
    }

    state.draft.output = document.getElementById('reviewText').value;

    // Si se edita un mensaje pero se genera otro módulo (ej: WhatsApp → OS1), se guarda como registro nuevo
    const original = state.editId ? cachedMsgs.find(x => x.id === state.editId) : null;
    const targetId = (original && original.module === state.draft.mod) ? state.editId : null;

    state.editId = await saveMessage({
      data: state.draft.data,
      output: state.draft.output,
      titulo: state.draft.titulo,
      module: state.draft.mod
    }, targetId);

    clearLocalDraft();
    await loadMessages();

    state.draft = null;
    state.view = 'view';
    render();

  } catch (error) {
    alert("Hubo un error al guardar en la base de datos de Firebase: \n\n" + error.message);
    if (event && event.target) {
      event.target.innerText = "💾 Guardar Procedimiento";
      event.target.disabled = false;
    }
  }
}

/* --- 10. VISTA FINAL Y COPIADO --- */
function renderView() {
  const m = cachedMsgs.find(x => x.id === state.editId);
  if(!m) { state.view='dashboard'; return render(); }

  const os1Btn = m.module === 'm1'
    ? `<button class="btn-outline" onclick="generateOS1Draft('${m.id}')" style="border-color:#3fc7c7; color:#3fc7c7;">📄 Generar OS1 Independiente</button>`
    : '';

  app.innerHTML = `
    <div class="top-bar"><button class="btn-text" onclick="goDashboard()">← Volver al historial</button></div>
    <h1>${esc(moduleName(m.module))}</h1>
    <div class="card">
      <pre class="output" id="finalOutput">${esc(m.output)}</pre>
      <div class="btn-row" style="margin-top:20px;">
        <button class="btn-outline" onclick="copyToClipboard()">📋 Copiar texto</button>
        <button class="btn-primary btn-whatsapp" onclick="sendToWhatsApp()">📲 Enviar WhatsApp</button>
      </div>
      <div class="btn-row" style="margin-top:10px;">
        <button class="btn-outline" onclick="editMsg('${m.id}')">✏️ Editar este mensaje</button>
        <button class="btn-danger btn-outline" onclick="deleteMsg('${m.id}')">🗑️ Eliminar</button>
        ${os1Btn}
      </div>
    </div>
  `;
}

function copyToClipboard() {
  const text = document.getElementById('finalOutput').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  });
}

function sendToWhatsApp() {
  const text = document.getElementById('finalOutput').textContent;
  window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent(text), '_blank');
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
